[package]
name = "axis-rest"
description = "Asynchronous Discord REST API client for the Axis Discord library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axis-core.workspace = true
axis-model.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# HTTPS via rustls: no OpenSSL dependency, works on all platforms.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

[dev-dependencies]
# Local HTTP mock server for request/response tests.
mockito = "1"

[lints]
workspace = true
