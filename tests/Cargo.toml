[package]
name = "axis-integration-tests"
description = "Cross-crate integration tests exercising Axis's public API surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The test targets live at the package root (see [[test]] below) so the
# directory layout matches the repository plan: `tests/*.rs`.
autotests = false

[dependencies]
axis = { path = "../crates/axis" }
serde_json.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
futures-util.workspace = true
mockito = "1"
tokio.workspace = true

[[test]]
name = "public_api"
path = "public_api.rs"

[[test]]
name = "long_running"
path = "long_running.rs"

[lints]
workspace = true
